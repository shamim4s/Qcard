<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Profile - Qcard by Shamim4s</title>
<link rel="stylesheet" href="style.css">
<!-- html2pdf.js for vector-grade PDF download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- ID Card Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  .theme-light {
    --bg: #f1f5f9;
    --bg-card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
  }
  .theme-light .profile-section {
    background: #f8fafc;
  }
  .theme-light .contact-row a {
    color: #0f172a;
  }
  .company-logo {
    max-width: 60px;
    max-height: 40px;
    object-fit: contain;
    margin-right: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading profile from Google Sheets...</div></div>

<script>
"use strict";

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEu_YG7FOobkwoqEdmuHU1QfEww9m2Jv209jOksykwceli4Nu45uG9h92QUEvD6epd/exec";

const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function escapeVCard(value) {
  if (!value) return "";
  return String(value).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/;/g, "\\;").replace(/,/g, "\\,");
}

function formatVCardDate(dateString) {
  if (!dateString) return "";
  const cleaned = String(dateString).split("T")[0].replace(/-/g, "").trim();
  return /^\d{8}$/.test(cleaned) ? cleaned : "";
}

function normalizeWebsite(value) {
  const v = String(value || "").trim();
  return !v ? "" : (/^https?:\/\//i.test(v) ? v : "https://" + v);
}

function formatVCardPhoto(base64Data) {
  if (!base64Data || typeof base64Data !== 'string') return '';
  let cleanBase64 = base64Data;
  if (cleanBase64.includes(',')) {
    cleanBase64 = cleanBase64.split(',')[1];
  }
  cleanBase64 = cleanBase64.replace(/[\r\n\s]/g, '');
  if (!cleanBase64) return '';
  const chunks = cleanBase64.match(/.{1,72}/g) || [];
  return `PHOTO;ENCODING=b;TYPE=JPEG:\r\n ${chunks.join('\r\n ')}`;
}

function createVCard(profile) {
  const nameParts = String(profile.name || "").trim().split(/\s+/).filter(Boolean);
  const firstName = nameParts.shift() || "";
  const lastName = nameParts.join(" ");

  const addresses = [];
  if (profile.address1) addresses.push(`ADR;TYPE=${escapeVCard(profile.address1Label || 'HOME')}:;;${escapeVCard(profile.address1)};;;;`);
  if (profile.address2) addresses.push(`ADR;TYPE=${escapeVCard(profile.address2Label || 'WORK')}:;;${escapeVCard(profile.address2)};;;;`);
  if (profile.address3) addresses.push(`ADR;TYPE=${escapeVCard(profile.address3Label || 'OTHER')}:;;${escapeVCard(profile.address3)};;;;`);

  let photoTag = "";
  if (profile.photo) {
    photoTag = formatVCardPhoto(profile.photo);
  }

  const socialLines = [
    ["LinkedIn", profile.linkedin], ["WeChat", profile.wechat], ["Telegram", profile.telegram],
    ["Discord", profile.discord], ["Facebook", profile.facebook], ["Instagram", profile.instagram],
    ["X", profile.x], ["TikTok", profile.tiktok], ["YouTube", profile.youtube], ["GitHub", profile.github]
  ].filter(([, url]) => url).map(([name, url]) => `X-SOCIALPROFILE;TYPE=${name}:${escapeVCard(url)}`);

  const bdayTag = profile.dob ? `BDAY:${formatVCardDate(profile.dob)}` : "";

  const noteParts = [];
  if (profile.bloodGroup) noteParts.push(`Blood Group: ${profile.bloodGroup}`);
  if (profile.about) noteParts.push(profile.about);
  const noteTag = noteParts.length > 0 ? `NOTE:${escapeVCard(noteParts.join(" | "))}` : "";

  const nowIso = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const uniqueContactUid = `urn:uuid:qcard-${profile.id}`;

  return [
    "BEGIN:VCARD","VERSION:3.0",
    `UID:${uniqueContactUid}`,
    `REV:${nowIso}`,
    `N:${escapeVCard(lastName)};${escapeVCard(firstName)};;;`,
    `FN:${escapeVCard(profile.name)}`,
    bdayTag,
    profile.bloodGroup ? `X-BLOOD-GROUP:${escapeVCard(profile.bloodGroup)}` : "",
    profile.jobTitle ? `TITLE:${escapeVCard(profile.jobTitle)}` : "",
    profile.company ? `ORG:${escapeVCard(profile.company)}` : "",
    profile.phone ? `TEL;TYPE=VOICE:${escapeVCard(profile.phone)}` : "",
    profile.mobile ? `TEL;TYPE=CELL:${escapeVCard(profile.mobile)}` : "",
    profile.email ? `EMAIL;TYPE=INTERNET:${escapeVCard(profile.email)}` : "",
    profile.companyEmail ? `EMAIL;TYPE=WORK:${escapeVCard(profile.companyEmail)}` : "",
    profile.companyPhone ? `TEL;TYPE=WORK:${escapeVCard(profile.companyPhone)}` : "",
    ...addresses,
    profile.website ? `URL:${escapeVCard(normalizeWebsite(profile.website))}` : "",
    profile.companyWebsite ? `URL;TYPE=WORK:${escapeVCard(normalizeWebsite(profile.companyWebsite))}` : "",
    ...socialLines,
    noteTag,
    profile.additionalInformation ? `X-ADDITIONAL-INFORMATION:${escapeVCard(profile.additionalInformation)}` : "",
    photoTag,
    "END:VCARD"
  ].filter(Boolean).join("\r\n");
}

function saveContact(profile) {
  const blob = new Blob([createVCard(profile)], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = (profile.id || "contact") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function savePDF(profile) {
  const element = document.getElementById("pdf-content") || document.querySelector(".card-container") || document.body;
  const opt = {
    margin:       [10, 10, 10, 10],
    filename:     `${(profile.name || profile.id || 'contact').replace(/\s+/g, '_')}_profile.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}

async function loadProfile() {
  if (!id) {
    window.location.href = "admin.html";
    return;
  }
  const response = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      action: "read",
      origin: window.location.href,
      id: encodeURIComponent(id)
    }),
    redirect: "follow"
  });
  const json = await response.json();
  if (json.status === "success" && json.data) {
    return json.data;
  }
  throw new Error(json.message || "Profile not found in Google Sheets.");
}

const SOCIAL_META = {
  facebook:  { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-facebook.svg", label: "Facebook" },
  github:    { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-github.svg", label: "GitHub" },
  instagram: { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-instagram.svg", label: "Instagram" },
  linkedin:  { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-linkedin.svg", label: "LinkedIn" },
  tiktok:    { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-tiktok.svg", label: "TikTok" },
  x:         { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-x.svg", label: "X" },
  youtube:   { url: "https://raw.githubusercontent.com/shamim4s/Qcard/refs/heads/master/svg/tc-youtube.svg", label: "YouTube" }
};

function generateSocialLinksHtml(profile) {
  return Object.keys(SOCIAL_META).filter(key => profile[key]).map(key => {
    const meta = SOCIAL_META[key];
    const targetUrl = normalizeWebsite(profile[key]);
    return `<a href="${escapeHTML(targetUrl)}" target="_blank" rel="noopener noreferrer" aria-label="${meta.label}" title="${meta.label}" style="display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:5px; overflow:hidden; transition:transform 0.2s;">
      <img src="${meta.url}" alt="${meta.label}" style="width:100%; height:100%; object-fit:contain; border-radius:5px; display:block;">
    </a>`;
  }).join("");
}

function renderTemplate(templateString, context) {
  let output = templateString;

  output = output.replace(/{{#if\s+(!)?(\w+)}}([\s\S]*?){{\/if}}/g, (match, notFlag, key, content) => {
    const val = context[key];
    const isTruthy = Boolean(val && String(val).trim() !== "");
    const condition = notFlag ? !isTruthy : isTruthy;
    return condition ? content : "";
  });

  output = output.replace(/{{(\w+)}}/g, (match, key) => {
    return context[key] !== undefined ? context[key] : "";
  });

  return output;
}

function renderProfile(profile) {
  if (!profile) return;
  document.title = (profile.name || "Contact") + " - Qcard by Shamim4s";

  if (profile.theme === "dark") {
    document.body.classList.remove("theme-light");
  } else {
    document.body.classList.add("theme-light");
  }

  const socialLinksHtml = generateSocialLinksHtml(profile);
  const currentUrl = window.location.href;
  const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;

  const context = {
    ...profile,
    dob: profile.dob ? profile.dob.split("T")[0] : "",
    companyJoiningDate: profile.companyJoiningDate ? profile.companyJoiningDate.split("T")[0] : "",
    firstChar: escapeHTML((profile.name || "?").charAt(0).toUpperCase()),
    hasSocials: Boolean(socialLinksHtml),
    socialLinksHtml: socialLinksHtml,
    qrCodeUrl: qrCodeUrl
  };

  const mainTemplate = profile.templateHtml || `
    <div class="profile-page">
      <main class="profile">
        <h1>{{name}}</h1>
        <div class="title">{{jobTitle}}</div>
      </main>
    </div>
  `;

  let renderedHtml = renderTemplate(mainTemplate, context);

  // If user selected an ID Card theme, render and append it inside the printable card
  if (profile.idCardHtml) {
    const renderedIdCard = renderTemplate(profile.idCardHtml, context);
    if (renderedHtml.includes('id="pdf-content"')) {
      renderedHtml = renderedHtml.replace('</div>\n\n  <!-- ================= FIXED BOTTOM ACTION BAR', `${renderedIdCard}</div>\n\n  <!-- ================= FIXED BOTTOM ACTION BAR`);
    } else {
      renderedHtml += renderedIdCard;
    }
  }

  app.innerHTML = renderedHtml;

  document.getElementById("saveContact")?.addEventListener("click", () => saveContact(profile));
  document.getElementById("savePdf")?.addEventListener("click", () => savePDF(profile));
}

async function render() {
  try {
    const profile = await loadProfile();
    renderProfile(profile);
  } catch (error) {
    app.innerHTML = `<div class="error"><h2>Profile unavailable</h2><p>${escapeHTML(error.message)}</p></div>`;
  }
}
render();
</script>
</body>
</html>
