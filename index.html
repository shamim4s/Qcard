<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div class="loading">Loading profile from Google Sheets...</div></div>

<script>
"use strict";

// REPLACE THIS WITH YOUR DEPLOYED WEB APP URL
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_APPS_SCRIPT_ID/exec";

const app = document.getElementById("app");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function escapeVCard(value) {
  if (!value) return "";
  return String(value).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/;/g, "\\;").replace(/,/g, "\\,");
}

function normalizeWebsite(value) {
  const v = String(value || "").trim();
  return !v ? "" : (/^https?:\/\//i.test(v) ? v : "https://" + v);
}

function createVCard(profile) {
  const nameParts = String(profile.name || "").trim().split(/\s+/).filter(Boolean);
  const firstName = nameParts.shift() || "";
  const lastName = nameParts.join(" ");
  const addressLines = [profile.address1, profile.address2, profile.address3]
    .filter(Boolean)
    .map((address, index) => `ADR;TYPE=${index === 0 ? "HOME" : index === 1 ? "WORK" : "OTHER"}:;;${escapeVCard(address)};;;;`);
  
  const photo = (profile.photo && profile.photo.includes(",")) 
    ? `PHOTO;ENCODING=b;TYPE=JPEG:${String(profile.photo).split(",")[1]}` 
    : "";

  const socialLines = [
    ["LinkedIn", profile.linkedin], ["WeChat", profile.wechat], ["Facebook", profile.facebook],
    ["Instagram", profile.instagram], ["X", profile.x], ["TikTok", profile.tiktok],
    ["YouTube", profile.youtube], ["GitHub", profile.github]
  ].filter(([, url]) => url).map(([name, url]) => `X-SOCIALPROFILE;TYPE=${name}:${escapeVCard(url)}`);

  return [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${escapeVCard(lastName)};${escapeVCard(firstName)};;;`,
    `FN:${escapeVCard(profile.name)}`,
    profile.jobTitle ? `TITLE:${escapeVCard(profile.jobTitle)}` : "",
    profile.company ? `ORG:${escapeVCard(profile.company)}` : "",
    profile.phone ? `TEL;TYPE=VOICE:${escapeVCard(profile.phone)}` : "",
    profile.mobile ? `TEL;TYPE=CELL:${escapeVCard(profile.mobile)}` : "",
    profile.email ? `EMAIL:${escapeVCard(profile.email)}` : "",
    ...addressLines,
    profile.website ? `URL:${escapeVCard(normalizeWebsite(profile.website))}` : "",
    ...socialLines,
    profile.about ? `NOTE:${escapeVCard(profile.about)}` : "",
    profile.additionalInformation ? `X-ADDITIONAL-INFORMATION:${escapeVCard(profile.additionalInformation)}` : "",
    photo,"END:VCARD"
  ].filter(Boolean).join("\r\n");
}

function saveContact(profile) {
  const blob = new Blob([createVCard(profile)], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = (profile.id || "contact") + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function loadProfile() {
  if (!id) throw new Error("No profile ID was supplied.");
  const response = await fetch(`${APPS_SCRIPT_URL}?action=read&id=${encodeURIComponent(id)}`);
  const json = await response.json();
  if (json.status === "success" && json.data) {
    return json.data;
  }
  throw new Error("Profile not found in Google Sheets.");
}

const SOCIAL_META = {
  linkedin: {label:"LinkedIn", icon:"in"},
  wechat: {label:"WeChat", icon:"W"},
  facebook: {label:"Facebook", icon:"f"},
  instagram: {label:"Instagram", icon:"◎"},
  x: {label:"X", icon:"𝕏"},
  tiktok: {label:"TikTok", icon:"♪"},
  youtube: {label:"YouTube", icon:"▶"},
  github: {label:"GitHub", icon:"⌨"}
};

function socialLinks(profile) {
  return Object.keys(SOCIAL_META).filter(key => profile[key]).map(key => {
    const meta = SOCIAL_META[key];
    const url = normalizeWebsite(profile[key]);
    return `<a class="social-link social-${key}" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer" aria-label="${meta.label}" title="${meta.label}">
      <span class="social-icon">${meta.icon}</span><span>${meta.label}</span>
    </a>`;
  }).join("");
}

function renderProfile(profile) {
  document.title = (profile.name || "Contact") + " - Qcard by Shamim4s";

  const phoneLink = profile.phone
    ? `<div class="contact-row"><span>📞</span><a href="tel:${escapeHTML(profile.phone)}">${escapeHTML(profile.phone)}</a></div>` : "";
  const mobileLink = profile.mobile
    ? `<div class="contact-row"><span>📱</span><a href="tel:${escapeHTML(profile.mobile)}">${escapeHTML(profile.mobile)}</a></div>` : "";
  const emailLink = profile.email
    ? `<div class="contact-row"><span>✉️</span><a href="mailto:${escapeHTML(profile.email)}">${escapeHTML(profile.email)}</a></div>` : "";
  const websiteLink = profile.website
    ? `<div class="contact-row"><span>🌐</span><a href="${escapeHTML(normalizeWebsite(profile.website))}" target="_blank" rel="noopener">Website</a></div>` : "";
  const companyRow = profile.company
    ? `<div class="contact-row"><span>🏢</span><span>${escapeHTML(profile.company)}</span></div>` : "";

  const address = (profile.address1 || profile.address2 || profile.address3)
    ? `<section class="profile-section"><h3>Address</h3>
        ${profile.address1 ? `<div>${escapeHTML(profile.address1)}</div>` : ''}
        ${profile.address2 ? `<div>${escapeHTML(profile.address2)}</div>` : ''}
        ${profile.address3 ? `<div>${escapeHTML(profile.address3)}</div>` : ''}
      </section>` : "";
  const about = profile.about
    ? `<section class="profile-section"><h3>About</h3><p>${escapeHTML(profile.about)}</p></section>` : "";
  const additional = profile.additionalInformation
    ? `<section class="profile-section"><h3>Additional Information</h3><div>${escapeHTML(profile.additionalInformation)}</div></section>` : "";
  const socials = socialLinks(profile)
    ? `<section class="profile-section"><h3>Social Media</h3><div class="social-links">${socialLinks(profile)}</div></section>` : "";

  app.innerHTML = `
    <div class="profile-page">
      <main class="profile">
        <div class="profile-badge">DIGITAL CONTACT</div>
        ${profile.photo
          ? `<img class="profile-avatar" src="${escapeHTML(profile.photo)}" alt="${escapeHTML(profile.name)}">`
          : `<div class="profile-avatar profile-avatar-placeholder">${escapeHTML((profile.name || "?").charAt(0).toUpperCase())}</div>`}
        <h1>${escapeHTML(profile.name)}</h1>
        <div class="title">${escapeHTML(profile.jobTitle || '')}</div>
        ${profile.company ? `<div class="company">${escapeHTML(profile.company)}</div>` : ""}
        <div class="profile-actions">
          <button id="saveContact" class="btn success">💾 Save Contact</button>
          ${profile.phone ? `<a class="btn primary" href="tel:${escapeHTML(profile.phone)}">📞 Call</a>` : ""}
          ${profile.mobile ? `<a class="btn primary" href="tel:${escapeHTML(profile.mobile)}">📱 Mobile</a>` : ""}
          ${profile.email ? `<a class="btn secondary" href="mailto:${escapeHTML(profile.email)}">✉️ Email</a>` : ""}
          ${profile.website ? `<a class="btn dark" href="${escapeHTML(normalizeWebsite(profile.website))}" target="_blank" rel="noopener">🌐 Website</a>` : ""}
        </div>

        <section class="profile-section">
          <h3>Contact</h3>
          ${phoneLink}${mobileLink}${emailLink}${websiteLink}${companyRow}
          ${socials ? `<div class="contact-socials">${socialLinks(profile)}</div>` : ""}
        </section>

        ${address}
        ${about}
        ${additional}
        ${socials}
        <div class="profile-footer">Powered by <a href="https://shamim4s.github.io/" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none;">Shamim4s</a></div>
      </main>
    </div>`;

  document.getElementById("saveContact").addEventListener("click", () => saveContact(profile));
}

async function render() {
  try {
    const profile = await loadProfile();
    renderProfile(profile);
  } catch (error) {
    app.innerHTML = `<div class="error"><h2>Profile unavailable</h2><p>${escapeHTML(error.message)}</p></div>`;
  }
}
render();
</script>
</body>
</html>
