<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Blue Gradient ID Card</title>
    <!-- Using Roboto for that clean, standard corporate sans-serif look -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #d8dee3; /* Subtle grey background for presentation */
            font-family: 'Roboto', sans-serif;
            padding: 20px;
        }

        /* 
         * Main Card Container
         * Proportions scaled to standard CR80 vertical dimensions (600x950)
         */
        .id-card {
            width: 600px;
            height: 950px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 30px 20px -20px rgba(25, 49, 138, 0.3); /* Base shadow + blue tint shadow at bottom */
            display: flex;
            flex-direction: column;
        }

        /* 
         * SVG Background for Exact Geometric Shapes & Waves
         */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-shapes svg {
            width: 100%;
            height: 100%;
        }

        /* 
         * Foreground Content Wrapper
         */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Header / Logo Section (Top) */
        .header-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 50px;
            padding-left: 20px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            margin-right: 15px;
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-title {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .logo-tagline {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Profile Picture */
        .profile-pic {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 10px solid #2da3de; /* Vibrant Blue Border */
            background-color: #ffffff; 
            position: absolute;
            top: 180px; /* Positioned to straddle the wave */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .profile-pic svg {
            width: 90%;
            height: 90%;
            transform: translateY(12px); /* Align silhouette to the bottom */
        }

        /* Typography Block (Name & Title) */
        .typography-area {
            margin-top: 400px; /* Push content below profile pic */
            text-align: center;
        }

        .user-name {
            font-size: 38px;
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-title {
            font-size: 24px;
            font-weight: 400;
            color: #333333;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Details Information Grid */
        .details-wrapper {
            width: 60%;
            margin-top: 40px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 90px 30px auto;
            row-gap: 12px;
            font-size: 20px;
            font-weight: 500;
            color: #111111;
            align-items: center;
        }

        .detail-label {
            text-transform: uppercase;
            text-align: left;
        }

        .detail-colon {
            text-align: center;
        }

        .detail-value {
            text-align: left;
        }

        /* Barcode Area */
        .barcode-container {
            width: 65%;
            height: 65px;
            border: 2px solid #999999;
            border-radius: 4px;
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 15px;
            background-color: #ffffff;
        }

        .bar {
            background-color: #222222;
            height: 100%;
        }

        /* Barcode Width Utility Classes */
        .w-1 { width: 2px; }
        .w-2 { width: 4px; }
        .w-3 { width: 6px; }
        .w-4 { width: 8px; }

    </style>
</head>
<body>

    <div class="id-card">
        
        <!-- Precision Geometric Background Shapes -->
        <div class="bg-shapes">
            <svg viewBox="0 0 600 950" preserveAspectRatio="none">
                <defs>
                    <!-- Linear Gradient for Top and Bottom shapes -->
                    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#38aee2; stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#162f83; stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- TOP BACKGROUND (Darker shadow fold layer behind) -->
                <path d="M 0,0 L 600,0 L 600,200 C 400,280 200,380 0,320 Z" fill="#132773" />
                
                <!-- TOP BACKGROUND (Main sweeping gradient) -->
                <path d="M 0,0 L 600,0 L 600,140 C 450,220 200,420 0,270 Z" fill="url(#blueGradient)" />

                <!-- BOTTOM FOOTER (Pointed downward chevron) -->
                <!-- Slight shadow overlap for depth -->
                <path d="M 0,865 L 300,915 L 600,865 L 600,950 L 0,950 Z" fill="#132773" opacity="0.6" />
                <path d="M 0,875 L 300,925 L 600,875 L 600,950 L 0,950 Z" fill="url(#blueGradient)" />
            </svg>
        </div>

        <div class="content">
            
            <!-- Header/Logo area -->
            <div class="header-area">
                <!-- Recreating the Hexagonal Logo in SVG -->
                <svg class="logo-icon" viewBox="0 0 100 100">
                    <!-- Outer Hexagon -->
                    <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
                    <!-- Inner Hexagon -->
                    <polygon points="50,25 72,38 72,62 50,75 28,62 28,38" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
                    <!-- Center Dot -->
                    <circle cx="50" cy="50" r="8" fill="#ffffff"/>
                </svg>
                <div class="logo-text-group">
                    <div class="logo-title">COMPANY NAME</div>
                    <div class="logo-tagline">TAGLINE GOES HERE</div>
                </div>
            </div>

            <!-- Profile Placeholder (Silhouette Match) -->
            <div class="profile-pic">
                <!-- Classic suited silhouette SVG -->
                <svg viewBox="0 0 100 100">
                    <!-- Suit Jacket -->
                    <path d="M10,100 L35,55 L50,65 L65,55 L90,100 Z" fill="#222222"/>
                    <!-- Shirt -->
                    <path d="M35,55 L50,65 L65,55 L50,85 Z" fill="#ffffff"/>
                    <!-- Tie -->
                    <polygon points="48,64 52,64 54,90 50,95 46,90" fill="#222222"/>
                    <!-- Head & Neck -->
                    <path d="M50,10 C38,10 32,22 32,35 C32,48 38,55 50,55 C62,55 68,48 68,35 C68,22 62,10 50,10 Z M42,50 C42,50 38,55 35,55 C42,55 45,52 45,52 Z" fill="#222222"/>
                </svg>
            </div>

            <!-- Typography -->
            <div class="typography-area">
                <div class="user-name">Name Surname</div>
                <div class="user-title">Graphic Designer</div>
            </div>

            <!-- Information Grid -->
            <div class="details-wrapper">
                <div class="details-grid">
                    <div class="detail-label">ID</div>
                    <div class="detail-colon">:</div>
                    <div class="detail-value">AB-0000</div>

                    <div class="detail-label">DOB</div>
                    <div class="detail-colon">:</div>
                    <div class="detail-value">DD/MM/YY</div>

                    <div class="detail-label">Phone</div>
                    <div class="detail-colon">:</div>
                    <div class="detail-value">+00 0000 0000</div>

                    <div class="detail-label">E Mail</div>
                    <div class="detail-colon">:</div>
                    <div class="detail-value">Your mail Here</div>
                </div>
            </div>

            <!-- Simulated Barcode Box -->
            <div class="barcode-container">
                <div class="bar w-2"></div><div class="bar w-1"></div><div class="bar w-4"></div>
                <div class="bar w-2"></div><div class="bar w-1"></div><div class="bar w-3"></div>
                <div class="bar w-1"></div><div class="bar w-2"></div><div class="bar w-4"></div>
                <div class="bar w-2"></div><div class="bar w-3"></div><div class="bar w-1"></div>
                <div class="bar w-4"></div><div class="bar w-1"></div><div class="bar w-2"></div>
                <div class="bar w-2"></div><div class="bar w-3"></div><div class="bar w-1"></div>
                <div class="bar w-1"></div><div class="bar w-4"></div><div class="bar w-2"></div>
                <div class="bar w-3"></div><div class="bar w-1"></div><div class="bar w-2"></div>
                <div class="bar w-4"></div>
            </div>

        </div>

    </div>

</body>
</html>
