<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Slogan ID Card</title>
    <!-- Using Montserrat for a clean, geometric sans-serif look matching the image -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #d1d5db;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        /* 
         * Main Card Container
         * CR80 Proportions (600x950)
         */
        .id-card {
            width: 600px;
            height: 950px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* SVG Background Shapes */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-shapes svg {
            width: 100%;
            height: 100%;
        }

        /* Foreground Content */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Header / Logo */
        .header-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
            width: 100%;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-title {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1;
        }

        .logo-subtitle {
            font-size: 11px;
            font-weight: 500;
            color: #cccccc;
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Profile Picture */
        .profile-pic {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 10px solid #2cb1e1; /* Cyan border */
            position: absolute;
            top: 220px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #f0f0f0; /* Fallback for transparency */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* CSS Checkerboard to match the image's transparency placeholder */
        .profile-pic::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            z-index: 1;
        }

        /* Typography Block (Name & Title) */
        .typography-area {
            margin-top: 430px; /* Pushes text below profile picture */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .user-name {
            font-size: 40px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .name-first {
            color: #2cb1e1; /* Cyan */
            font-weight: 700;
        }
        
        .name-last {
            color: #2a2a2a; /* Dark Grey/Black */
            font-weight: 600;
        }

        .user-title {
            color: #555555;
            font-size: 22px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Details Block */
        .info-block {
            margin-top: 40px;
            width: 70%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: #555555;
            font-size: 22px;
            font-weight: 400;
        }

        .info-line {
            display: flex;
        }

        .info-label {
            width: 140px; /* Fixed width to align colons roughly */
            text-align: left;
        }

        .info-value {
            flex: 1;
            text-align: left;
            margin-left: 10px;
        }

        /* Barcode Area */
        .barcode-container {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .barcode-bars {
            height: 50px;
            width: 60%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bar {
            background-color: #333333;
            height: 100%;
        }

        /* Barcode Width Classes */
        .w-1 { width: 2px; }
        .w-2 { width: 4px; }
        .w-3 { width: 6px; }
        .w-4 { width: 8px; }

        .barcode-text {
            margin-top: 8px;
            font-size: 14px;
            color: #555555;
            font-weight: 500;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="id-card">
        
        <!-- Precision Geometric Background Shapes -->
        <div class="bg-shapes">
            <svg viewBox="0 0 600 950" preserveAspectRatio="none">
                
                <!-- TOP CYAN BASE LAYER (Extends lower than the dark layer) -->
                <path d="M 0,0 L 600,0 L 600,340 C 450,460 150,460 0,340 Z" fill="#2cb1e1" />
                
                <!-- TOP DARK CHARCOAL LAYER -->
                <path d="M 0,0 L 600,0 L 600,280 C 450,420 150,420 0,280 Z" fill="#1a1c20" />
                
                <!-- BOTTOM LEFT CYAN LAYER -->
                <path d="M 0,720 C 150,850 250,950 450,950 L 0,950 Z" fill="#2cb1e1" />
                
                <!-- BOTTOM LEFT DARK CYAN LAYER (Adds depth) -->
                <path d="M 0,830 C 80,900 150,950 300,950 L 0,950 Z" fill="#117da8" />
                
                <!-- BOTTOM RIGHT CYAN LAYER -->
                <path d="M 600,820 C 500,850 450,950 350,950 L 600,950 Z" fill="#2cb1e1" />

            </svg>
        </div>

        <div class="content">
            
            <!-- Header/Logo area -->
            <div class="header-area">
                <!-- Abstract Shield/Drop Logo SVG -->
                <div class="logo-icon">
                    <svg viewBox="0 0 100 100">
                        <!-- Outer Shield -->
                        <path d="M 20,20 L 70,20 C 90,20 90,55 70,75 L 45,100 L 20,75 C 0,55 0,20 20,20 Z" fill="none" stroke="#2cb1e1" stroke-width="8" stroke-linejoin="round" />
                        <!-- Inner Filled Shield -->
                        <path d="M 30,30 L 60,30 C 75,30 75,50 60,65 L 45,80 L 30,65 C 15,50 15,30 30,30 Z" fill="#2cb1e1" />
                    </svg>
                </div>
                <div class="logo-text-group">
                    <div class="logo-title">BRAND</div>
                    <div class="logo-subtitle">SLOGAN GOES HERE</div>
                </div>
            </div>

            <!-- Profile Picture (With checkered transparency placeholder) -->
            <div class="profile-pic">
                <!-- Left empty to show the CSS transparency grid -->
            </div>

            <!-- Typography -->
            <div class="typography-area">
                <div class="user-name">
                    <span class="name-first">JONAS</span> <span class="name-last">SMITH</span>
                </div>
                <div class="user-title">YOUR TITLE HERE</div>
            </div>

            <!-- Details Block -->
            <div class="info-block">
                <div class="info-line">
                    <div class="info-label">Id Number</div>
                    <div class="info-value">: 00000</div>
                </div>
                <div class="info-line">
                    <div class="info-label">E-mail</div>
                    <div class="info-value">: your mail name here</div>
                </div>
                <div class="info-line">
                    <div class="info-label">Phone</div>
                    <div class="info-value">: +00 000 0000</div>
                </div>
            </div>

            <!-- Barcode Area -->
            <div class="barcode-container">
                <div class="barcode-bars">
                    <div class="bar w-2"></div><div class="bar w-1"></div><div class="bar w-4"></div>
                    <div class="bar w-2"></div><div class="bar w-1"></div><div class="bar w-3"></div>
                    <div class="bar w-1"></div><div class="bar w-2"></div><div class="bar w-4"></div>
                    <div class="bar w-2"></div><div class="bar w-3"></div><div class="bar w-1"></div>
                    <div class="bar w-4"></div><div class="bar w-1"></div><div class="bar w-2"></div>
                    <div class="bar w-2"></div><div class="bar w-3"></div><div class="bar w-1"></div>
                    <div class="bar w-1"></div><div class="bar w-4"></div><div class="bar w-2"></div>
                    <div class="bar w-3"></div><div class="bar w-1"></div><div class="bar w-2"></div>
                    <div class="bar w-4"></div>
                </div>
                <div class="barcode-text">(01)012345678910</div>
            </div>

        </div>

    </div>

</body>
</html>
