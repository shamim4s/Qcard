<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolyn Willis ID Card</title>
    <!-- Using Montserrat for the clean, geometric sans-serif aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;0,900;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e5e7eb;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        /* 
         * Main Card Container
         * CR80 Proportions (600x950)
         */
        .id-card {
            width: 600px;
            height: 950px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* SVG Background Shapes */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-shapes svg {
            width: 100%;
            height: 100%;
        }

        /* Foreground Content */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Header / Logo */
        .logo-area {
            position: absolute;
            top: 60px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
        }

        .logo-subtitle {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #d7dbdd;
            margin-bottom: -5px;
        }

        .logo-title {
            font-size: 46px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Profile Picture */
        .profile-pic {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 12px solid #ffffff;
            position: absolute;
            top: 210px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #e2e8f0;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Typography Block (Name & Title) */
        .typography-area {
            position: absolute;
            top: 710px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .user-name {
            font-size: 42px;
            font-weight: 800;
            color: #d32236; /* Crimson Red */
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .user-title {
            font-size: 26px;
            font-weight: 600;
            font-style: italic;
            color: #2a363f; /* Dark Slate */
            letter-spacing: 1px;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-style: italic;
            color: #d1d5db; /* Light grey */
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <div class="id-card">
        
        <!-- Precision Geometric Background Shapes -->
        <div class="bg-shapes">
            <svg viewBox="0 0 600 950" preserveAspectRatio="none">
                
                <!-- Base Layer: Dark Slate -->
                <rect width="600" height="950" fill="#283643" />
                
                <!-- Layer 2: Light Grey Left Polygon -->
                <polygon points="0,280 120,0 280,600 0,800" fill="#d7dbdd" />
                
                <!-- Layer 3: Crimson Red Right Polygon -->
                <!-- Creates the dark slate triangle in the top right -->
                <polygon points="420,0 600,190 600,700 280,550" fill="#d32236" />
                
                <!-- Layer 4: White Bottom Cutout (Inverted 'V') -->
                <!-- Masks the bottoms of the geometric shapes above -->
                <polygon points="0,680 300,530 600,680 600,950 0,950" fill="#ffffff" />

            </svg>
        </div>

        <div class="content">
            
            <!-- Header/Logo area -->
            <div class="logo-area">
                <div class="logo-subtitle">title goes here</div>
                <div class="logo-title">logo</div>
            </div>

            <!-- Profile Picture -->
            <div class="profile-pic">
                <!-- High-quality professional placeholder -->
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Carolyn Willis">
            </div>

            <!-- Typography -->
            <div class="typography-area">
                <div class="user-name">CAROLYN WILLIS</div>
                <div class="user-title">Founder & CEO</div>
            </div>

            <!-- Footer -->
            <div class="footer">
                your website here
            </div>

        </div>

    </div>

</body>
</html>
