<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Exact ID Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #d1d5db;
            font-family: 'Montserrat', sans-serif;
            padding: 50px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 50px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .card-wrapper {
            position: relative;
            width: 300px;
            height: 475px; /* 600x950 scaled by 0.5 */
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            background: #fff;
            overflow: hidden;
        }

        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #111827;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 16px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .id-card {
            width: 600px;
            height: 950px;
            background-color: #ffffff;
            border-radius: 40px; /* Scaled will be 20px */
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: scale(0.5);
            transform-origin: 0 0;
        }

        .bg-shapes { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;}
        .bg-shapes svg { width: 100%; height: 100%; }

        .content {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            align-items: center; flex: 1; padding-top: 60px;
        }

        .logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        
        .logo-box {
            background-color: var(--logo-bg); color: var(--logo-text);
            width: 80px; height: 80px; border-radius: 16px; display: flex;
            justify-content: center; align-items: center; font-size: 34px; font-weight: 800; margin-bottom: 12px;
        }
        
        .company-name { font-size: 26px; font-weight: 800; color: var(--header-text); letter-spacing: 0.5px; }
        .company-tagline { font-size: 10px; font-weight: 700; color: var(--header-sub); letter-spacing: 2.5px; margin-top: 6px; }

        .profile-pic {
            width: 230px; height: 230px; border-radius: 50%;
            border: 12px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden; margin-bottom: 25px; background: #eee;
            position: relative;
        }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }

        .user-name { font-size: 36px; font-weight: 800; color: #111827; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .user-title { font-size: 18px; font-weight: 600; color: #4b5563; margin-bottom: 35px; }

        .details-container { width: 75%; display: flex; flex-direction: column; gap: 16px; margin-left: 20px;}
        .detail-row { display: flex; align-items: center; font-size: 17px; color: #374151; }
        .detail-icon { width: 22px; height: 22px; margin-right: 15px; fill: var(--icon-color); flex-shrink: 0; }
        .detail-label { width: 75px; font-weight: 500; color: #6b7280; }
        .detail-separator { margin-right: 15px; color: #6b7280; font-weight: 600; }
        .detail-value { font-weight: 700; color: #111827; }

        .footer {
            background-color: var(--footer-bg); color: #ffffff; text-align: center;
            padding: 24px 0; font-size: 16px; font-weight: 500; letter-spacing: 1px;
            position: absolute; bottom: 0; width: 100%; z-index: 2;
        }
    </style>
</head>
<body>
    <div class="gallery">



        <div class="card-wrapper">
            <div class="badge">19</div>
            <div class="id-card" style="
                --logo-bg: #142c61; 
                --logo-text: #ffffff;
                --header-text: #111827;
                --header-sub: #6b7280;
                --icon-color: #142c61;
                --footer-bg: #142c61;
            ">
                <div class="bg-shapes">
                    <svg viewBox="0 0 600 950" preserveAspectRatio="none">
                        
            <!-- 19: Minimalistic clean cut triangles -->
            <polygon points="0,0 300,0 0,300" fill="#142c61"/>
            <polygon points="0,300 80,300 0,380" fill="#5889ed"/>
            <polygon points="600,950 300,950 600,650" fill="#142c61"/>
            <polygon points="600,650 520,650 600,570" fill="#5889ed"/>
            
            <rect x="0" y="450" width="20" height="180" fill="#5889ed" opacity="0.3"/>
            <rect x="580" y="320" width="20" height="180" fill="#5889ed" opacity="0.3"/>
        
                    </svg>
                </div>
                <div class="content">
                    <div class="logo-container">
                        <div class="logo-box">NX</div>
                        <div class="company-name">NEXORA GROUP</div>
                        <div class="company-tagline">PEOPLE &bull; PERFORMANCE &bull; PROGRESS</div>
                    </div>
                    <div class="profile-pic">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Profile">
                    </div>
                    <div class="user-name">ALISHBA AMNA</div>
                    <div class="user-title">Graphic Designer</div>
                    
                    <div class="details-container">
                        <div class="detail-row">
                            <svg class="detail-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm4 12H8v-1c0-2 4-3.1 4-3.1s4 1.1 4 3.1v1z"/></svg>
                            <span class="detail-label">ID</span><span class="detail-separator">:</span><span class="detail-value">NXG-4587</span>
                        </div>
                        <div class="detail-row">
                            <svg class="detail-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <span class="detail-label">Email</span><span class="detail-separator">:</span><span class="detail-value">alishba@nexora.com</span>
                        </div>
                        <div class="detail-row">
                            <svg class="detail-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                            <span class="detail-label">Phone</span><span class="detail-separator">:</span><span class="detail-value">+123 456 7890</span>
                        </div>
                        <div class="detail-row">
                            <svg class="detail-icon" viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
                            <span class="detail-label">Dept</span><span class="detail-separator">:</span><span class="detail-value">Design Department</span>
                        </div>
                    </div>
                </div>
                <div class="footer">www.nexoragroup.com</div>
            </div>
        </div>


    </div>
</body>
</html>
