<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #ccfbf1; display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; color: #134e4a; }
        .card-container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 32px; overflow: hidden; box-shadow: 0 20px 40px rgba(13,148,136,0.15); border: 1.5px solid #99f6e4; }
        
        .clinic-header { background: #0f766e; color: white; padding: 24px 20px; text-align: center; }
        .clinic-name { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #99f6e4; }
        
        .doctor-hero { padding: 24px 20px 10px; text-align: center; }
        .doc-avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 4px solid #ccfbf1; margin-bottom: 12px; }
        .doc-name { font-size: 22px; font-weight: 800; color: #115e59; }
        .doc-spec { font-size: 13px; font-weight: 600; color: #0d9488; margin-top: 2px; }
        .doc-creds { font-size: 11px; color: #64748b; margin-top: 4px; }
        
        .appointment-cta { margin: 16px 20px; padding: 14px; background: #0d9488; color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px; box-shadow: 0 8px 20px rgba(13,148,136,0.25); }
        
        .contact-card-box { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }
        .c-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #f0fdfa; border: 1px solid #ccfbf1; border-radius: 14px; text-decoration: none; color: #134e4a; font-size: 13px; font-weight: 600; }
        .ci-icon { width: 32px; height: 32px; border-radius: 10px; background: #ccfbf1; color: #0d9488; display: flex; align-items: center; justify-content: center; }
        .ci-icon svg { width: 16px; height: 16px; }
        
        .save-vcf { width: 100%; padding: 14px; background: #134e4a; color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>

            <button class="save-vcf" onclick="downloadVCF('Dr. Marcus Vance', '+16175550143', 'dr.vance@stjudemedical.org', 'Senior Consultant Cardiologist', 'St. Jude Medical Institute', 'https://stjudemedical.org', 'Boston, MA')">

    <script>
        
function downloadVCF(name, phone, email, title, org, website, address) {
    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTITLE:${title}\nTEL;TYPE=CELL:${phone}\nEMAIL;TYPE=WORK:${email}\nURL:${website}\nADR;TYPE=WORK:;;${address};;;;\nEND:VCARD`;
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const newLink = document.createElement('a');
    newLink.download = `${name.replace(/\s+/g, '_')}_contact.vcf`;
    newLink.href = url;
    newLink.click();
    URL.revokeObjectURL(url);
}

function shareProfile(title, url) {
    if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Profile link copied to clipboard!');
    }
}

    </script>
</body>
