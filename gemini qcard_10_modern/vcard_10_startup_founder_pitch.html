        .tr-val { font-size: 18px; font-weight: 800; color: #f59e0b; }
        .tr-lbl { font-size: 11px; color: #a8a29e; }

        .contact-group { padding: 0 20px 24px; display: flex; flex-direction: column; gap: 10px; }
        .ct-btn { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: #292524; border-radius: 14px; text-decoration: none; color: #f5f5f4; font-size: 13px; font-weight: 600; border: 1px solid #44403c; }
        .ct-btn:hover { border-color: #f59e0b; }
        .ct-l { display: flex; align-items: center; gap: 10px; }
        .ct-l svg { width: 18px; height: 18px; color: #f59e0b; }
        
        .save-card-full { width: 100%; margin-top: 10px; padding: 15px; background: #ffffff; color: #1c1917; border: none; border-radius: 16px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>

    <script>
        
function downloadVCF(name, phone, email, title, org, website, address) {
    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTITLE:${title}\nTEL;TYPE=CELL:${phone}\nEMAIL;TYPE=WORK:${email}\nURL:${website}\nADR;TYPE=WORK:;;${address};;;;\nEND:VCARD`;
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const newLink = document.createElement('a');
    newLink.download = `${name.replace(/\s+/g, '_')}_contact.vcf`;
    newLink.href = url;
    newLink.click();
    URL.revokeObjectURL(url);
}

function shareProfile(title, url) {
    if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Profile link copied to clipboard!');
    }
}

    </script>
