        body { background: #fef08a; display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; color: #000000; font-family: 'Work Sans', sans-serif; }
        .card-container { width: 100%; max-width: 420px; background: #ffffff; border: 3px solid #000000; border-radius: 20px; padding: 24px; box-shadow: 8px 8px 0px #000000; }

        .neo-avatar-box { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
        .neo-avatar { width: 88px; height: 88px; border-radius: 16px; border: 3px solid #000000; object-fit: cover; box-shadow: 4px 4px 0px #000000; }
        .neo-name { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.1; }
        .neo-role { font-size: 13px; font-weight: 700; color: #4b5563; margin-top: 4px; }
        
        .neo-links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .neo-btn { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #ffffff; border: 2.5px solid #000000; border-radius: 12px; box-shadow: 4px 4px 0px #000000; text-decoration: none; color: #000000; font-weight: 700; font-size: 14px; transition: 0.1s; }
        .neo-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000000; }
        .neo-btn svg { width: 20px; height: 20px; }
        
        .btn-yellow { background: #fef08a; }
        .btn-cyan { background: #bae6fd; }
        .btn-pink { background: #fbcfe8; }
        .btn-lime { background: #d9f99d; }
        
        .main-save-btn { width: 100%; padding: 16px; background: #000000; color: #ffffff; border: 3px solid #000000; border-radius: 14px; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 5px 5px 0px #a855f7; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .main-save-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0px #a855f7; }
    </style>

    <script>
        
function downloadVCF(name, phone, email, title, org, website, address) {
    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTITLE:${title}\nTEL;TYPE=CELL:${phone}\nEMAIL;TYPE=WORK:${email}\nURL:${website}\nADR;TYPE=WORK:;;${address};;;;\nEND:VCARD`;
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const newLink = document.createElement('a');
    newLink.download = `${name.replace(/\s+/g, '_')}_contact.vcf`;
    newLink.href = url;
    newLink.click();
    URL.revokeObjectURL(url);
}

function shareProfile(title, url) {
    if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Profile link copied to clipboard!');
    }
}

    </script>
