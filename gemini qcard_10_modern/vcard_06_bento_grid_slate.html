    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; color: #0f172a; }
        .card-container { width: 100%; max-width: 420px; }
        
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .bento-item { background: #ffffff; border-radius: 24px; padding: 18px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.2s; }
        .bento-item:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.07); }
        
        .col-span-2 { grid-column: span 2; }
        
        /* Hero Bento */
        .hero-bento { display: flex; align-items: center; gap: 16px; padding: 20px; }
        .bento-avatar { width: 72px; height: 72px; border-radius: 20px; object-fit: cover; border: 2px solid #2563eb; }
        .bento-name { font-size: 19px; font-weight: 800; color: #0f172a; }
        .bento-role { font-size: 12px; color: #64748b; font-weight: 600; margin-top: 2px; }
        
        /* Action Bento */
        .action-tile { display: flex; flex-direction: column; justify-content: space-between; height: 110px; text-decoration: none; color: inherit; }
        .act-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .act-icon svg { width: 20px; height: 20px; }
        .act-title { font-size: 13px; font-weight: 700; margin-top: 6px; }
        .act-sub { font-size: 11px; color: #64748b; }
        
        .bg-blue { background: #eff6ff; color: #2563eb; }
        .bg-emerald { background: #ecfdf5; color: #059669; }
        .bg-amber { background: #fffbeb; color: #d97706; }
        .bg-indigo { background: #e0e7ff; color: #4338ca; }
        
        .cta-bento { background: #0f172a; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; padding: 18px; }
        .cta-bento:hover { background: #1e293b; }
        .cta-bento svg { width: 20px; height: 20px; }
    </style>
</head>

    <script>
        
function downloadVCF(name, phone, email, title, org, website, address) {
    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTITLE:${title}\nTEL;TYPE=CELL:${phone}\nEMAIL;TYPE=WORK:${email}\nURL:${website}\nADR;TYPE=WORK:;;${address};;;;\nEND:VCARD`;
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const newLink = document.createElement('a');
    newLink.download = `${name.replace(/\s+/g, '_')}_contact.vcf`;
    newLink.href = url;
    newLink.click();
    URL.revokeObjectURL(url);
}

function shareProfile(title, url) {
    if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Profile link copied to clipboard!');
    }
}
