    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #fae8ff; display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; color: #1e1b4b; }
        .card-container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 36px; overflow: hidden; box-shadow: 0 25px 50px rgba(168, 85, 247, 0.2); border: 2px solid #f5d0fe; }
        
        .mesh-header { background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f97316 100%); padding: 36px 20px 70px; color: white; text-align: center; }
        .agency-pill { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 5px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .floating-profile { background: #ffffff; margin: -50px 20px 0; border-radius: 28px; padding: 24px 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); text-align: center; border: 1px solid #fdf4ff; }
        .avatar-3d { width: 100px; height: 100px; border-radius: 30px; margin: -60px auto 12px; border: 5px solid #ffffff; box-shadow: 0 10px 25px rgba(236,72,153,0.3); object-fit: cover; }
        
        .author-name { font-size: 22px; font-weight: 800; color: #1e1b4b; }
        .author-tagline { font-size: 13px; color: #86198f; font-weight: 600; margin-top: 4px; }
        
        /* Tab Nav */
        .tab-bar { display: flex; background: #fdf4ff; border-radius: 16px; padding: 4px; margin-top: 18px; }
        .tab-btn { flex: 1; padding: 8px 0; font-size: 12px; font-weight: 700; border: none; border-radius: 12px; background: transparent; color: #a21caf; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #ffffff; color: #701a75; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        
        .tab-content { margin-top: 20px; text-align: left; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .creative-link { display: flex; align-items: center; gap: 14px; padding: 13px 16px; background: #faf5ff; border-radius: 16px; margin-bottom: 10px; text-decoration: none; color: #4c1d95; font-size: 13px; font-weight: 600; border: 1px solid #f3e8ff; }
        .cl-icon { width: 32px; height: 32px; border-radius: 10px; background: #f0abfc; color: #701a75; display: flex; align-items: center; justify-content: center; }
        .cl-icon svg { width: 16px; height: 16px; }
        
        .save-pink-btn { width: 100%; margin-top: 14px; padding: 14px; background: linear-gradient(90deg, #8b5cf6, #ec4899); color: white; border: none; border-radius: 18px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(236,72,153,0.35); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .save-pink-btn svg { width: 18px; height: 18px; }

    <script>
        
function downloadVCF(name, phone, email, title, org, website, address) {
    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTITLE:${title}\nTEL;TYPE=CELL:${phone}\nEMAIL;TYPE=WORK:${email}\nURL:${website}\nADR;TYPE=WORK:;;${address};;;;\nEND:VCARD`;
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const newLink = document.createElement('a');
    newLink.download = `${name.replace(/\s+/g, '_')}_contact.vcf`;
    newLink.href = url;
    newLink.click();
    URL.revokeObjectURL(url);
}

function shareProfile(title, url) {
    if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Profile link copied to clipboard!');
    }
}

        function switchTab(index) {
            const btns = document.querySelectorAll('.tab-btn');
            const panes = document.querySelectorAll('.tab-pane');
            btns.forEach((b, i) => b.classList.toggle('active', i === index));
            panes.forEach((p, i) => p.classList.toggle('active', i === index));
        }
    </script>
