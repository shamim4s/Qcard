    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: #e0f2fe; display: flex; justify-content: center; min-height: 100vh; padding: 20px 10px; color: #1e293b; }
        .card-container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 36px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.25); border: 2px solid #bae6fd; }

        .order-btn { font-size: 12px; font-weight: 600; color: white; text-decoration: none; display: flex; align-items: center; gap: 4px; opacity: 0.9; }
        
        .profile-card { background: #ffffff; margin: -40px 16px 0; border-radius: 28px; padding: 24px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; border: 1px solid #f0f9ff; }
        .avatar-wrap { position: relative; display: inline-block; }
        .avatar-img { width: 110px; height: 110px; border-radius: 28px; object-fit: cover; border: 4px solid #ffffff; box-shadow: 0 10px 20px rgba(2, 132, 199, 0.18); }
        .header-actions { position: absolute; right: 0; top: 0; display: flex; gap: 8px; }
        .icon-chip { width: 34px; height: 34px; border-radius: 10px; background: #f0f9ff; border: 1px solid #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-chip svg { width: 16px; height: 16px; }
        
        .user-name { font-size: 22px; font-weight: 800; color: #0f172a; margin-top: 14px; }
        .user-role { font-size: 14px; color: #64748b; font-weight: 600; margin-top: 4px; }
        
        /* 4 Button Action Grid */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-pill-solid { background: #0284c7; color: white; border: none; padding: 12px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; box-shadow: 0 4px 12px rgba(2,132,199,0.3); transition: 0.2s; }
        .action-pill-outline { background: #ffffff; color: #0284c7; border: 1.5px solid #0284c7; padding: 11px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; transition: 0.2s; }
        .action-pill-solid:hover, .action-pill-outline:hover { transform: translateY(-2px); }
        
        /* Contact List with Arrow navigation */
        .contact-section { padding: 20px; }
        .contact-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #f8fafc; border-radius: 18px; margin-bottom: 10px; text-decoration: none; color: #334155; border: 1px solid #f1f5f9; transition: 0.2s; }
        .contact-row:hover { background: #f0f9ff; border-color: #bae6fd; }
        .c-left { display: flex; align-items: center; gap: 12px; }
        .c-icon-badge { width: 34px; height: 34px; border-radius: 10px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; }
        .c-icon-badge svg { width: 18px; height: 18px; }
        .c-val { font-size: 13.5px; font-weight: 600; }
        .c-arrow svg { width: 16px; height: 16px; color: #0284c7; }
        
        /* Social Networks */
        .social-box { padding: 10px 20px 24px; text-align: left; }
        .social-heading { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 12px; }
        .social-chips { display: flex; gap: 12px; }
        .soc-round { width: 44px; height: 44px; border-radius: 50%; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; }
        .soc-round svg { width: 20px; height: 20px; }
        .soc-round:hover { transform: scale(1.08); background: #0284c7; }
    </style>

    <script>
        
function downloadVCF(name, phone, email, title, org, website, address) {
    const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTITLE:${title}\nTEL;TYPE=CELL:${phone}\nEMAIL;TYPE=WORK:${email}\nURL:${website}\nADR;TYPE=WORK:;;${address};;;;\nEND:VCARD`;
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const newLink = document.createElement('a');
    newLink.download = `${name.replace(/\s+/g, '_')}_contact.vcf`;
    newLink.href = url;
    newLink.click();
    URL.revokeObjectURL(url);
}

function shareProfile(title, url) {
    if (navigator.share) {
        navigator.share({ title: title, url: url || window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(url || window.location.href);
        alert('Profile link copied to clipboard!');
    }
}
