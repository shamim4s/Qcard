<!-- Navy top band, white body -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <rect width="600" height="120" fill="#0a1f44"/>
</svg>

<!-- Royal Blue bottom band -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <rect y="830" width="600" height="120" fill="#0033cc"/>
</svg>

<!-- Teal top-left corner accent -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <polygon points="0,0 200,0 0,200" fill="#008080"/>
</svg>

<!-- Emerald bottom-right corner accent -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <polygon points="600,950 400,950 600,750" fill="#006400"/>
</svg>

<!-- Burgundy top and bottom thin bars -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <rect width="600" height="40" fill="#800020"/>
  <rect y="910" width="600" height="40" fill="#800020"/>
</svg>

<!-- Indigo diagonal top accent -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <polygon points="0,0 600,0 0,150" fill="#4b0082"/>
</svg>

<!-- Gold bottom wave accent -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <path d="M0,850 Q300,750 600,850 L600,950 L0,950 Z" fill="#ffd700"/>
</svg>

<!-- Cyan top-right corner accent -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <polygon points="600,0 400,0 600,200" fill="#00ffff"/>
</svg>

<!-- Graphite bottom diagonal accent -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <polygon points="0,950 600,750 600,950" fill="#2f2f2f"/>
</svg>

<!-- Emerald + Navy dual corner accents -->
<svg width="600" height="950" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="950" fill="white"/>
  <polygon points="0,0 200,0 0,200" fill="#006400"/>
  <polygon points="600,950 400,950 600,750" fill="#0a1f44"/>
</svg>
